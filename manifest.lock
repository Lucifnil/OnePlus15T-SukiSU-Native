# Exact anchors extracted from the matching PLZ110 stock boot image. The stock
# kernel commit resolves to the official OnePlus Common repository above.
STOCK_FIRMWARE_BUILD=PLZ110_16.0.10.500_CN01
STOCK_BOOT_KERNEL_COMMIT=844001fb8721c3ee305f17a51628744997f787a0
STOCK_BOOT_KERNEL_RELEASE=6.12.38-android16-5-g844001fb8721-ab14552068-4k
STOCK_BOOT_SHA256=a2877bb8fb45286095363c6528f1fc2fec75660b53cc2879fd48c35cee55347d
# The pinned June 2026 Kleaf tree declares vmlinux_oki as a build output. This
# one-line build-only compatibility change is taken from later official OnePlus
# Common commit f8f8b74b16ada675c549773d263d797c68e4c294.
STOCK_BUILD_COMPAT_SOURCE_COMMIT=f8f8b74b16ada675c549773d263d797c68e4c294
STOCK_BUILD_COMPAT_PATCH=patches/0001-export-vmlinux-oki.patch
STOCK_BUILD_COMPAT_PATCH_SHA256=4d50c7442b5a6433c5c395a4f0418fd4ea707fdfb828154978b648a485b6ac93
# The public OnePlus Kleaf tree injects an OKI "o" infix, while the shipping
# PLZ110 kernel was stamped without it and with Android build id ab14552068.
# Use Kleaf's documented workspace_status.json override plus this one-line
# format patch so the source-built kernel has the stock module ABI release.
STOCK_SCMVERSION=-g844001fb8721-ab14552068
STOCK_SCMVERSION_PATCH=patches/0002-match-stock-scmversion-format.patch
STOCK_SCMVERSION_PATCH_SHA256=ec59598460253043ed0a4e047f9a22a133ed7da045745fbe553b2b20740f6641

