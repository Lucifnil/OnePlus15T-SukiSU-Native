# Exact anchors extracted from the matching PLZ110 stock boot image. The stock
# kernel commit resolves to the official OnePlus Common repository above.
STOCK_FIRMWARE_BUILD=PLZ110_16.0.10.500_CN01
STOCK_BOOT_KERNEL_COMMIT=844001fb8721c3ee305f17a51628744997f787a0
STOCK_BOOT_KERNEL_RELEASE=6.12.38-android16-5-g844001fb8721-ab14552068-4k
STOCK_BOOT_SHA256=a2877bb8fb45286095363c6528f1fc2fec75660b53cc2879fd48c35cee55347d
# The pinned June 2026 Kleaf tree declares vmlinux_oki as a build output. This
# one-line build-only compatibility change is taken from later official OnePlus
# Common commit f8f8b74b16ada675c549773d263d797c68e4c294.
STOCK_BUILD_COMPAT_SOURCE_COMMIT=f8f8b74b16ada675c549773d263d797c68e4c294
STOCK_BUILD_COMPAT_PATCH=patches/0001-export-vmlinux-oki.patch
STOCK_BUILD_COMPAT_PATCH_SHA256=4d50c7442b5a6433c5c395a4f0418fd4ea707fdfb828154978b648a485b6ac93
# The public OnePlus Kleaf tree injects an OKI "o" infix, while the shipping
# PLZ110 kernel was stamped without it and with Android build id ab14552068.
# Use Kleaf's documented workspace_status.json override plus this one-line
# format patch so the source-built kernel has the stock module ABI release.
STOCK_SCMVERSION=-g844001fb8721-ab14552068
STOCK_SCMVERSION_PATCH=patches/0002-match-stock-scmversion-format.patch
STOCK_SCMVERSION_PATCH_SHA256=ec59598460253043ed0a4e047f9a22a133ed7da045745fbe553b2b20740f6641
# PLZ110 ships unsigned GKI/vendor modules and loads them successfully. The
# public generic Common target otherwise marks all GKI module exports as
# signature-protected and rejects 103 shipping modules, including cfg80211.
# Keep the config string identical to stock while supplying an empty generated
# protected-module list, matching the shipping kernel's observed policy.
STOCK_MODULE_POLICY_PATCH=patches/0004-match-stock-unsigned-gki-module-policy.patch
STOCK_MODULE_POLICY_PATCH_SHA256=ea3e62c85f8a84195acd2252ea05005a571262a5728b24b02143fa5ea91ffb86

# The shipping oplus_bsp_sched_ext.ko uses split BTF and therefore requires the
# exact base type-ID namespace generated by the pristine official-source build.
# This blob is extracted from that source-built baseline (not from OEM firmware)
# and is injected before the final vmlinux link; resolve_btfids still runs after
# the link and rejects any built-in BTF ID that the compatible base cannot name.
VENDOR_BTF_COMPAT_ASSET=assets/plz110-16.0.10.500-source-baseline.btf.zst
VENDOR_BTF_COMPAT_ASSET_SHA256=b255f32c23c0a2a3806f6b52349171ceedf2369a8853c0cc1987ad7b22d8a734
VENDOR_BTF_COMPAT_SHA256=c7693da6516da0aa0170b78ce838dd17cccd40f9a1cedac6bba47f40ad542658
VENDOR_BTF_COMPAT_TYPE_COUNT=164887
VENDOR_BTF_COMPAT_TYPE_LEN=4186436
VENDOR_BTF_COMPAT_STRING_LEN=2724181
VENDOR_BTF_COMPAT_PATCH=patches/0009-use-plz110-vendor-compatible-btf.patch
VENDOR_BTF_COMPAT_PATCH_SHA256=a42d7ecd026cccb0cc588e82dd7e3ff875bcd48d83c05a2bc4ea72795a21768a

