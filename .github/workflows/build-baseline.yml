name: Build OnePlus 15T official clean baseline

on:
  workflow_dispatch:
    inputs:
      kernel_variant:
        description: Kernel variant to build
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - sukisu_builtin
          - sukisu_susfs_builtin
      publish_release:
        description: Publish the verified AnyKernel3 baseline as a prerelease
        required: true
        default: true
        type: boolean
      diagnostic_allow_shell:
        description: Diagnostic only - grant ADB shell root on a temporary SukiSU boot
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: oneplus15t-${{ inputs.kernel_variant }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SOURCE_DIR: ${{ github.workspace }}/work/source
  KLEAF_DIST: ${{ github.workspace }}/kleaf-dist

jobs:
  build:
    name: Official stock-matched 4K GKI (${{ inputs.kernel_variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout build project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Load immutable source manifest
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source manifest.lock
          set +a
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < manifest.lock

      - name: Show runner storage
        shell: bash
        run: df -h

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ca-certificates cpio dwarves \
            file flex git libdw-dev libelf-dev libssl-dev lld llvm python3 \
            repo rsync unzip zip

      - name: Sync pinned OnePlus 15T source tree
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/prepare-manifest.sh" \
            "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/official-manifest.xml"
          pinned_manifest_repo="$GITHUB_WORKSPACE/work/pinned-manifest-repo"
          cp "$pinned_manifest_repo/$MANIFEST_FILE" \
            "$GITHUB_WORKSPACE/pinned-manifest.xml"
          pinned_manifest_commit=$(git -C "$pinned_manifest_repo" rev-parse HEAD)
          mkdir -p "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          repo init \
            -u "file://$pinned_manifest_repo" \
            -b "$pinned_manifest_commit" \
            -m "$MANIFEST_FILE" \
            --depth=1 \
            --no-clone-bundle
          test "$(git -C .repo/manifests rev-parse HEAD)" = "$pinned_manifest_commit"
          test -f ".repo/manifests/$MANIFEST_FILE"
          repo sync \
            --no-current-branch \
            --no-tags \
            --no-clone-bundle \
            --fail-fast \
            -j2
          bash "$GITHUB_WORKSPACE/scripts/verify-source.sh" "$SOURCE_DIR"
          repo manifest -r -o "$GITHUB_WORKSPACE/resolved-manifest.xml"
          printf 'SOURCE_DATE_EPOCH=%s\n' \
            "$(git -C "$SOURCE_DIR/kernel_platform/common" show -s --format=%ct HEAD)" \
            >> "$GITHUB_ENV"
          df -h

      - name: Build stock-matched official Common GKI with Kleaf
        shell: bash
        working-directory: ${{ github.workspace }}/work/source/kernel_platform
        env:
          KBUILD_BUILD_USER: oneplus15t-native
          KBUILD_BUILD_HOST: github-actions
          OPLUS_USE_PREBUILT_BOOTIMAGE: "no"
        run: |
          set -euo pipefail
          variant='${{ inputs.kernel_variant }}'
          diagnostic='${{ inputs.diagnostic_allow_shell }}'
          case "$variant" in
            baseline|sukisu_builtin|sukisu_susfs_builtin) ;;
            *) echo "ERROR: unknown kernel variant: $variant" >&2; exit 1 ;;
          esac
          if [[ "$diagnostic" == true && "$variant" == baseline ]]; then
            echo 'ERROR: diagnostic shell requires a SukiSU variant' >&2
            exit 1
          fi
          bazel_bin=prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel
          test "$($bazel_bin --version)" = "bazel $EXPECTED_BAZEL_VERSION"
          clang_bin="prebuilts/clang/host/linux-x86/clang-$EXPECTED_CLANG_VERSION/bin/clang"
          test -x "$clang_bin"
          "$clang_bin" --version | tee "$GITHUB_WORKSPACE/clang-version.txt"
          grep -Fq "Android ($EXPECTED_CLANG_BUILD," \
            "$GITHUB_WORKSPACE/clang-version.txt"
          grep -Fq "based on $EXPECTED_CLANG_VERSION) clang version 19.0.1" \
            "$GITHUB_WORKSPACE/clang-version.txt"
          grep -Fq '_CC_TOOLCHAIN_TYPE = Label(' \
            prebuilts/clang/host/linux-x86/kleaf/clang_toolchain.bzl

          # Match the setup and bzlmod overrides performed by Qualcomm's
          # official build_with_bazel.py wrapper while building the exact
          # OnePlus Common commit identified in the stock PLZ110 boot image.
          msm_extension=build/msm_kernel_extensions.bzl
          test ! -e "$msm_extension"
          ln -s ../soc-repo/kleaf-scripts/msm_kernel_extensions.bzl \
            "$msm_extension"

          # The stock Common commit predates the vmlinux_oki output expected by
          # the published OnePlus 15T Kleaf tree. Export a byte-identical alias
          # using the one-line fix later shipped by OnePlus itself. Restore the
          # official tree after the build so all provenance checks remain strict.
          stock_makefile=common/scripts/Makefile.vmlinux
          stock_makefile_backup=$(mktemp)
          cp "$stock_makefile" "$stock_makefile_backup"
          common_build_file=common/BUILD.bazel
          common_build_backup=$(mktemp)
          cp "$common_build_file" "$common_build_backup"
          stamp_file=build/kernel/kleaf/impl/stamp.bzl
          stamp_file_backup=$(mktemp)
          cp "$stamp_file" "$stamp_file_backup"
          workspace_status=common/workspace_status.json
          test ! -e "$workspace_status"
          ksu_driver_makefile_backup=
          ksu_driver_kconfig_backup=
          ksu_driver_link=
          susfs_common_backup=
          susfs_common_file_list=
          cleanup() {
            cp "$stock_makefile_backup" "$stock_makefile"
            cp "$common_build_backup" "$common_build_file"
            cp "$stamp_file_backup" "$stamp_file"
            if [[ -n "$ksu_driver_makefile_backup" ]]; then
              cp "$ksu_driver_makefile_backup" common/drivers/Makefile
              cp "$ksu_driver_kconfig_backup" common/drivers/Kconfig
              rm -f "$ksu_driver_link" "$ksu_driver_makefile_backup" \
                "$ksu_driver_kconfig_backup"
            fi
            if [[ -n "$susfs_common_file_list" ]]; then
              while IFS= read -r path; do
                [[ -n "$path" ]] || continue
                target=$(realpath -m "common/$path")
                case "$target" in
                  "$PWD/common/"*) ;;
                  *) echo "ERROR: unsafe SUSFS cleanup path: $target" >&2; return 1 ;;
                esac
                rm -f -- "$target"
                if [[ -f "$susfs_common_backup/$path" ]]; then
                  mkdir -p "$(dirname "$target")"
                  cp -a "$susfs_common_backup/$path" "$target"
                fi
              done < "$susfs_common_file_list"
            fi
            rm -f "$stock_makefile_backup" "$common_build_backup" \
              "$stamp_file_backup" \
              "$workspace_status" "$msm_extension"
          }
          trap cleanup EXIT
          git -C common apply --check --unidiff-zero \
            "$GITHUB_WORKSPACE/$STOCK_BUILD_COMPAT_PATCH"
          git -C common apply --unidiff-zero --whitespace=error-all \
            "$GITHUB_WORKSPACE/$STOCK_BUILD_COMPAT_PATCH"
          grep -Fqx $'\t$(Q)cp $(objtree)/vmlinux $(objtree)/vmlinux_oki' \
            "$stock_makefile"

          # The shipping PLZ110 module set is unsigned. Match the stock
          # kernel's observed policy by retaining the config path while
          # generating an empty protected-export list for the Common target.
          git -C common apply --check --unidiff-zero \
            "$GITHUB_WORKSPACE/$STOCK_MODULE_POLICY_PATCH"
          git -C common apply --unidiff-zero --whitespace=error-all \
            "$GITHUB_WORKSPACE/$STOCK_MODULE_POLICY_PATCH"
          grep -Fqx '    content = [""],' "$common_build_file"
          git -C common diff --check

          # Kleaf officially supports SCMVERSION overrides through this JSON
          # file. Match the shipping PLZ110 release exactly so stock vendor
          # modules accept the source-built kernel's ABI release string.
          git -C .. apply --check --unidiff-zero \
            "$GITHUB_WORKSPACE/$STOCK_SCMVERSION_PATCH"
          git -C .. apply --unidiff-zero --whitespace=error-all \
            "$GITHUB_WORKSPACE/$STOCK_SCMVERSION_PATCH"
          printf '{"SCMVERSION":"%s"}\n' "$STOCK_SCMVERSION" > \
            "$workspace_status"
          grep -Fqx '                scmversion_prefix="-$android_release-$KMI_GENERATION"' \
            "$stamp_file"
          grep -Fqx "{\"SCMVERSION\":\"$STOCK_SCMVERSION\"}" \
            "$workspace_status"
          git -C .. diff --check

          if [[ "$variant" == sukisu_builtin || \
                "$variant" == sukisu_susfs_builtin ]]; then
            # Reproduce the official setup.sh integration without executing a
            # mutable remote script. Fetch the stable tag's immutable commit,
            # then link only its kernel/ directory into the Common tree.
            ksu_root="$PWD/KernelSU"
            test ! -e "$ksu_root"
            git init -q "$ksu_root"
            git -C "$ksu_root" remote add origin "$SUKISU_REPO"
            git -C "$ksu_root" fetch --filter=blob:none --no-tags origin \
              "refs/tags/$SUKISU_TAG:refs/tags/$SUKISU_TAG"
            test "$(git -C "$ksu_root" rev-parse "$SUKISU_TAG^{commit}")" = \
              "$SUKISU_COMMIT"
            git -C "$ksu_root" checkout -q -b main "$SUKISU_COMMIT"
            test "$(git -C "$ksu_root" rev-list --count HEAD)" = \
              "$SUKISU_COMMIT_COUNT"
            test "$((40000 + SUKISU_COMMIT_COUNT - 2815))" = \
              "$EXPECTED_SUKISU_VERSION_CODE"
            test ! -e "$ksu_root/kernel/susfs.c"
            test "$(sha256sum "$GITHUB_WORKSPACE/$SUKISU_BUILD_VERSION_PATCH" | awk '{print $1}')" = \
              "$SUKISU_BUILD_VERSION_PATCH_SHA256"
            git -C "$ksu_root" apply --check --unidiff-zero \
              "$GITHUB_WORKSPACE/$SUKISU_BUILD_VERSION_PATCH"
            git -C "$ksu_root" apply --unidiff-zero --whitespace=error-all \
              "$GITHUB_WORKSPACE/$SUKISU_BUILD_VERSION_PATCH"
            grep -Fqx "LOCAL_COUNT     := $SUKISU_COMMIT_COUNT" \
              "$ksu_root/kernel/Kbuild"
            grep -Fqx "VERSION_TAG     := ${SUKISU_TAG#v}" \
              "$ksu_root/kernel/Kbuild"
            grep -Fqx \
              "KSU_VERSION_FULL := v${SUKISU_TAG#v}-${SUKISU_COMMIT:0:8}@main" \
              "$ksu_root/kernel/Kbuild"
            git -C "$ksu_root" diff --check

            if [[ "$variant" == sukisu_susfs_builtin ]]; then
              # Pin the official SUSFS tree to the last v2.1.0 compatibility
              # commit accepted by the v4.1.3 manager. Never execute mutable
              # remote integration scripts.
              susfs_root="$PWD/SUSFS"
              test ! -e "$susfs_root"
              git init -q "$susfs_root"
              git -C "$susfs_root" remote add origin "$SUSFS_REPO"
              git -C "$susfs_root" fetch --depth=1 --no-tags origin \
                "$SUSFS_COMMIT"
              git -C "$susfs_root" checkout -q --detach FETCH_HEAD
              test "$(git -C "$susfs_root" rev-parse HEAD)" = "$SUSFS_COMMIT"

              # Save every Common file that the immutable patch may touch so
              # the post-build stock-source verification can restore it.
              susfs_common_backup=$(mktemp -d)
              susfs_common_file_list=$(mktemp)
              awk '/^\+\+\+ b\// { print substr($2, 3) }' \
                "$susfs_root/$SUSFS_KERNEL_PATCH" > "$susfs_common_file_list"
              printf '%s\n%s\n' "${SUSFS_SOURCE#kernel_patches/}" \
                "${SUSFS_HEADER#kernel_patches/}" >> "$susfs_common_file_list"
              printf '%s\n' "${SUSFS_DEF_HEADER#kernel_patches/}" >> \
                "$susfs_common_file_list"
              sort -u -o "$susfs_common_file_list" "$susfs_common_file_list"
              while IFS= read -r path; do
                if [[ -f "common/$path" ]]; then
                  mkdir -p "$susfs_common_backup/$(dirname "$path")"
                  cp -a "common/$path" "$susfs_common_backup/$path"
                fi
              done < "$susfs_common_file_list"

              bash "$GITHUB_WORKSPACE/scripts/apply-susfs.sh" \
                "$PWD/common" "$ksu_root" "$susfs_root"
              git -C common diff --binary > \
                "$GITHUB_WORKSPACE/susfs-common-applied.patch"
              git -C "$ksu_root" diff --binary > \
                "$GITHUB_WORKSPACE/susfs-sukisu-applied.patch"
              cp "$susfs_root/$SUSFS_KERNEL_PATCH" \
                "$GITHUB_WORKSPACE/susfs-official-common.patch"
              cp "$susfs_root/$SUSFS_KSU_PATCH" \
                "$GITHUB_WORKSPACE/susfs-official-ksu.patch"
              cp "$susfs_root/$SUSFS_SOURCE" \
                "$GITHUB_WORKSPACE/susfs.c"
              cp "$susfs_root/$SUSFS_HEADER" \
                "$GITHUB_WORKSPACE/susfs.h"
              cp "$susfs_root/$SUSFS_DEF_HEADER" \
                "$GITHUB_WORKSPACE/susfs_def.h"
            fi

            ksu_driver_makefile_backup=$(mktemp)
            ksu_driver_kconfig_backup=$(mktemp)
            cp common/drivers/Makefile "$ksu_driver_makefile_backup"
            cp common/drivers/Kconfig "$ksu_driver_kconfig_backup"
            ksu_driver_link=common/drivers/kernelsu
            test ! -e "$ksu_driver_link"
            ln -s "$(realpath --relative-to=common/drivers "$ksu_root/kernel")" \
              "$ksu_driver_link"
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' \
              common/drivers/Kconfig
            grep -Fqx 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile
            grep -Fqx 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
            if [[ "$diagnostic" == true ]]; then
              sed -i '/^config KSU_DEBUG$/,/^config KSU_MANUAL_SU$/ s/^\tdefault n$/\tdefault y/' \
                "$ksu_root/kernel/Kconfig"
              grep -A4 '^config KSU_DEBUG$' "$ksu_root/kernel/Kconfig" | \
                grep -Fqx $'\tdefault y'
            fi
          fi

          mkdir -p "$KLEAF_DIST"
          tools/bazel run \
            --config=release \
            --//build/kernel/kleaf:zstd_dwarf_compression \
            --incompatible_sandbox_hermetic_tmp=false \
            --noenable_workspace \
            --override_module=rules_kotlin=%workspace%/build/kernel/kleaf/bzlmod/fake_modules/rules_kotlin \
            --override_module=protobuf=%workspace%/build/kernel/kleaf/bzlmod/fake_modules/protobuf \
            --override_module=rules_java=%workspace%/build/kernel/kleaf/bzlmod/fake_modules/rules_java \
            //common:kernel_aarch64_dist \
            -- \
            --destdir="$KLEAF_DIST" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          if grep -Fq 'Using GKI vmlinux from:' "$GITHUB_WORKSPACE/build.log"; then
            echo 'ERROR: Oplus prebuilt vmlinux replaced the source-built kernel' >&2
            exit 1
          fi
          if [[ "$variant" == sukisu_builtin || \
                "$variant" == sukisu_susfs_builtin ]]; then
            grep -Fq -- \
              "-- SukiSU-Ultra version: $EXPECTED_SUKISU_VERSION_CODE [v${SUKISU_TAG#v}-${SUKISU_COMMIT:0:8}@main]" \
              "$GITHUB_WORKSPACE/build.log"
          fi
          if [[ "$variant" == sukisu_susfs_builtin ]]; then
            grep -Fq -- "-- SUSFS_VERSION: v$SUSFS_VERSION" \
              "$GITHUB_WORKSPACE/build.log"
          fi
          module_symvers=$(find -L bazel-bin/common -type f \
            -name Module.symvers -print -quit 2>/dev/null || true)
          if [[ -n "$module_symvers" ]]; then
            cp "$module_symvers" "$GITHUB_WORKSPACE/Module.symvers"
          fi

      - name: Verify source-built baseline
        shell: bash
        run: |
          set -euo pipefail
          image="$KLEAF_DIST/Image"
          test -s "$image"
          file "$image" | tee image-file.txt
          "$SOURCE_DIR/kernel_platform/common/scripts/extract-ikconfig" \
            "$image" > final.config
          test -s final.config
          variant='${{ inputs.kernel_variant }}'
          diagnostic='${{ inputs.diagnostic_allow_shell }}'
          bash scripts/verify-config.sh final.config "$variant"
          grep -Fqx 'CONFIG_DEBUG_INFO_COMPRESSED_ZSTD=y' final.config
          grep -Fq "CONFIG_CC_VERSION_TEXT=\"Android ($EXPECTED_CLANG_BUILD," \
            final.config
          if [[ "$diagnostic" == true ]]; then
            grep -Fqx 'CONFIG_KSU_DEBUG=y' final.config
          else
            grep -Fqx '# CONFIG_KSU_DEBUG is not set' final.config || \
              [[ "$variant" == baseline ]]
          fi

          if [[ -s "$KLEAF_DIST/kernel.release" ]]; then
            cp "$KLEAF_DIST/kernel.release" kernelrelease.txt
          else
            strings "$image" | \
              grep -m1 -E '^Linux version 6\.12\.38-' | \
              sed -E 's/^Linux version ([^ ]+).*/\1/' > kernelrelease.txt
          fi
          test "$(cat kernelrelease.txt)" = "$STOCK_BOOT_KERNEL_RELEASE"

          cat > stock-baseline.txt <<EOF
          firmware=$STOCK_FIRMWARE_BUILD
          stock_kernel_release=$STOCK_BOOT_KERNEL_RELEASE
          stock_boot_sha256=$STOCK_BOOT_SHA256
          official_common_commit=$COMMON_COMMIT
          build_compat_source_commit=$STOCK_BUILD_COMPAT_SOURCE_COMMIT
          build_compat_patch_sha256=$STOCK_BUILD_COMPAT_PATCH_SHA256
          scmversion_patch_sha256=$STOCK_SCMVERSION_PATCH_SHA256
          module_policy_patch_sha256=$STOCK_MODULE_POLICY_PATCH_SHA256
          kernel_variant=$variant
          diagnostic_allow_shell=$diagnostic
          EOF
          if [[ "$variant" == sukisu_builtin || \
                "$variant" == sukisu_susfs_builtin ]]; then
            printf 'sukisu_tag=%s\nsukisu_commit=%s\nsukisu_version_code=%s\n' \
              "$SUKISU_TAG" "$SUKISU_COMMIT" \
              "$EXPECTED_SUKISU_VERSION_CODE" >> stock-baseline.txt
          fi
          if [[ "$variant" == sukisu_susfs_builtin ]]; then
            printf 'susfs_branch=%s\nsusfs_commit=%s\nsusfs_version=%s\n' \
              "$SUSFS_BRANCH" "$SUSFS_COMMIT" "$SUSFS_VERSION" \
              >> stock-baseline.txt
          fi

          bash scripts/verify-source.sh "$SOURCE_DIR"
          sha256sum "$image" | tee image.sha256

      - name: Package verified AnyKernel3 baseline
        shell: bash
        run: |
          set -euo pipefail
          ak3="$GITHUB_WORKSPACE/work/AnyKernel3"
          git init -q "$ak3"
          git -C "$ak3" remote add origin "$ANYKERNEL_REPO"
          git -C "$ak3" fetch --depth=1 --no-tags origin "$ANYKERNEL_COMMIT"
          git -C "$ak3" checkout -q --detach FETCH_HEAD
          test "$(git -C "$ak3" rev-parse HEAD)" = "$ANYKERNEL_COMMIT"

          variant='${{ inputs.kernel_variant }}'
          diagnostic='${{ inputs.diagnostic_allow_shell }}'
          cp "$KLEAF_DIST/Image" "$ak3/Image"
          if [[ "$diagnostic" == true ]]; then
            if [[ "$variant" == sukisu_susfs_builtin ]]; then
              cp packaging/anykernel-sukisu-susfs.sh "$ak3/anykernel.sh"
            else
              cp packaging/anykernel-sukisu.sh "$ak3/anykernel.sh"
            fi
            package="OnePlus15T-SUKISU-DIAGNOSTIC-ALLOW-SHELL-6.12.38-r${GITHUB_RUN_NUMBER}.zip"
          elif [[ "$variant" == sukisu_susfs_builtin ]]; then
            cp packaging/anykernel-sukisu-susfs.sh "$ak3/anykernel.sh"
            package="OnePlus15T-SUKISU-SUSFS-BUILTIN-6.12.38-r${GITHUB_RUN_NUMBER}.zip"
          elif [[ "$variant" == sukisu_builtin ]]; then
            cp packaging/anykernel-sukisu.sh "$ak3/anykernel.sh"
            package="OnePlus15T-SUKISU-BUILTIN-6.12.38-r${GITHUB_RUN_NUMBER}.zip"
          else
            cp packaging/anykernel.sh "$ak3/anykernel.sh"
            package="OnePlus15T-OFFICIAL-CLEAN-6.12.38-baseline-r${GITHUB_RUN_NUMBER}.zip"
          fi
          rm -rf "$ak3/.git"

          mkdir -p dist
          (cd "$ak3" && zip -q -r "$GITHUB_WORKSPACE/dist/$package" .)
          (cd dist && sha256sum "$package" > SHA256SUMS)
          cp manifest.lock official-manifest.xml pinned-manifest.xml \
            resolved-manifest.xml \
            final.config kernelrelease.txt \
            image-file.txt image.sha256 stock-baseline.txt build.log \
            clang-version.txt dist/
          if [[ -s Module.symvers ]]; then
            cp Module.symvers dist/
          fi
          cp "$STOCK_BUILD_COMPAT_PATCH" "$STOCK_SCMVERSION_PATCH" \
            "$STOCK_MODULE_POLICY_PATCH" dist/
          if [[ "$variant" == sukisu_builtin || \
                "$variant" == sukisu_susfs_builtin ]]; then
            cp "$SUKISU_BUILD_VERSION_PATCH" dist/
          fi
          if [[ "$variant" == sukisu_susfs_builtin ]]; then
            cp "$SUSFS_SUKISU_ADAPT_PATCH" "$SUSFS_DISABLE_LOG_PATCH" \
              "$SUSFS_SELINUX_WRAPPER_PATCH" \
              "$SUSFS_UTS_REPLACEMENT_PATCH" \
              susfs-common-applied.patch susfs-sukisu-applied.patch \
              susfs-official-common.patch susfs-official-ksu.patch \
              susfs.c susfs.h susfs_def.h dist/
          fi
          if [[ "$diagnostic" == true ]]; then
            printf '%s\n' \
              'DIAGNOSTIC ONLY: CONFIG_KSU_DEBUG grants ADB shell root. Do not flash.' \
              > dist/DIAGNOSTIC-ONLY.txt
          fi

      - name: Upload verified baseline artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OnePlus15T-${{ inputs.kernel_variant }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

      - name: Create Chinese-first baseline prerelease
        if: ${{ inputs.publish_release && inputs.kernel_variant == 'baseline' && !inputs.diagnostic_allow_shell }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: official-stock-kmi-baseline-6.12.38-r${{ github.run_number }}
          name: OnePlus 15T 原厂提交纯净基线 r${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            OnePlus 15T（PLZ110）原厂内核提交纯净基线，真机兼容性验证用。

            - 原厂锚点：`PLZ110_16.0.10.500(CN01)`
            - 原厂内核：`6.12.38-android16-5-g844001fb8721-ab14552068-4k`
            - 一加官方源码提交：`844001fb8721c3ee305f17a51628744997f787a0`
            - 构建目标：`//common:kernel_aarch64_dist`（与原厂 boot 的 GKI 架构一致）
            - 无 Root、无 KernelSU、无 SukiSU
            - 无 SUSFS、KPM、ADIOS、ReKernel、TCP Brutal 或其他性能补丁
            - 不使用 Oplus 预编译 vmlinux，Image 由本次源码构建生成
            - 仅使用一行一加官方后续修复导出 Kleaf 所需的 `vmlinux_oki` 同内容副本
